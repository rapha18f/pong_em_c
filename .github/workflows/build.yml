name: Build MeuJogo Dreamcast  # ← Mude o nome

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dcbuild
        run: |
          sudo wget -O /usr/local/bin/dcbuild https://raw.githubusercontent.com/Nold360/docker-kallistios-sdk/master/dcbuild.sh
          sudo chmod +x /usr/local/bin/dcbuild

      - name: Compilar com dcbuild
        run: |
          script -q -e -c "dcbuild make" || true
          ls -la *.elf

      #- name: Instalar mkdcdisk
       # run: |
        #  sudo apt-get update
         # sudo apt-get install -y git meson build-essential pkg-config libisofs-dev
          #git clone https://gitlab.com/simulant/mkdcdisc
          #cd mkdcdisc
          #meson setup builddir
          #meson compile -C builddir
          #sudo cp builddir/mkdcdisc /usr/local/bin/mkdcdisk

      - name: Preparar .ELF para teste
        run: |
          ELF_FILE=$(ls *.elf 2>/dev/null | head -n 1)
          if [ -z "$ELF_FILE" ]; then
            echo "❌ ERRO: Nenhum arquivo .elf encontrado!"
            exit 1
          fi
          # Mude o nome do arquivo .ELF aqui
          cp "$ELF_FILE" meu_jogo_test.elf  # ← Mude

      #- name: Criar .CDI para projeto final
        #run: |
          #ELF_FILE=$(ls *.elf 2>/dev/null | head -n 1)
         # if [ -z "$ELF_FILE" ]; then
            #echo "❌ ERRO: Nenhum arquivo .elf encontrado!"
           # exit 1
          #fi
          #DATA=$(date +'%Y%m%d')
          # Mude o nome do jogo e o nome do arquivo .CDI aqui
          #mkdcdisk -e "$ELF_FILE" -o "meu_jogo_final_${DATA}.cdi" -n "MEU JOGO"  # ← Mude
          #mkdcdisk -e "$ELF_FILE" -o meu_jogo_latest.cdi -n "MEU JOGO"          # ← Mude

      - name: Fazer upload dos artefatos
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meu-jogo-dreamcast  # ← Mude
          path: |
            meu_jogo_test.elf       # ← Mude
            #meu_jogo_latest.cdi     # ← Mude
            #meu_jogo_final_*.cdi    # ← Mude

      - name: Fazer upload do .ELF (testes rápidos)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meu-jogo-elf-para-testes  # ← Mude
          path: meu_jogo_test.elf          # ← Mude