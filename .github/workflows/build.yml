name: Build Pong Dreamcast

on:
  push:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Baixar imagem
        run: docker pull ghcr.io/kallistiosunchained/dc-toolchain:14.2-stable

      - name: Inspecionar imagem
        run: |
          docker run --rm ghcr.io/kallistiosunchained/dc-toolchain:14.2-stable \
          /bin/bash -c '
            pwd
            echo "===== / ====="
            ls -la /
            echo "===== /opt ====="
            ls -la /opt || true
            echo "===== procurando environ ====="
            find / -name "environ*" 2>/dev/null
            echo "===== procurando Makefile.rules ====="
            find / -name "Makefile.rules" 2>/dev/null
            echo "===== ambiente ====="
            env | sort
          '
