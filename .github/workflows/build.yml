name: Build Dreamcast Pong

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Mostrar informações do sistema
        run: |
          uname -a
          gcc --version
          make --version
