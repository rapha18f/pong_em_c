name: Build Pong Dreamcast (dcbuild)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dcbuild
        run: |
          sudo wget -O /usr/local/bin/dcbuild https://raw.githubusercontent.com/Nold360/docker-kallistios-sdk/master/dcbuild.sh
          sudo chmod +x /usr/local/bin/dcbuild

      - name: Compilar com dcbuild
        run: dcbuild make

      - name: Instalar mkdcdisk
        run: |
          sudo apt-get update
          sudo apt-get install -y git meson build-essential pkg-config libisofs-dev
          git clone https://gitlab.com/simulant/mkdcdisc
          cd mkdcdisc
          meson setup builddir
          meson compile -C builddir
          sudo cp builddir/mkdcdisc /usr/local/bin/mkdcdisk

      - name: Criar imagem CDI
        run: |
          ELF_FILE=$(ls *.elf | head -n 1)
          mkdcdisk -e "$ELF_FILE" -o pong.cdi -n "PONG"

      - name: Fazer upload do CDI
        uses: actions/upload-artifact@v4
        with:
          name: pong-dreamcast
          path: pong.cdi
