name: Build Dreamcast Pong

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Clonar KallistiOS
        run: |
          sudo mkdir -p /opt/toolchains/dc
          sudo chown $USER:$USER /opt/toolchains/dc

          git clone https://github.com/KallistiOSUnchained/KallistiOS.git \
            /opt/toolchains/dc/kos

      - name: Procurar environ.sh
        run: |
          echo "=== Procurando em /opt ==="
          find /opt -name "environ.sh"

          echo "=== Procurando no workspace ==="
          find "$GITHUB_WORKSPACE" -name "environ.sh"

          echo "=== Conteúdo de /opt/toolchains/dc ==="
          ls -R /opt/toolchains/dc
      - name: Ver conteúdo do README
        run: |
          head -100 /opt/toolchains/dc/kos/README.md
      - name: Procurar instruções do environ
        run: |
          grep -R "environ.sh" /opt/toolchains/dc/kos -n
