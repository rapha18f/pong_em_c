name: Build Pong Dreamcast

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Baixar toolchain
        run: docker pull ghcr.io/kallistiosunchained/dc-toolchain:14.2-stable

      - name: Compilar o jogo
        run: |
          echo "========================================="
          echo "Compilando com Docker direto..."
          echo "========================================="
          
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/kallistiosunchained/dc-toolchain:14.2-stable \
            /bin/bash -c '
              echo "Configurando ambiente KOS..."
              
              # Procura o environ.sh
              if [ -f /opt/kos/environ.sh ]; then
                source /opt/kos/environ.sh
              elif [ -f /opt/toolchains/dc/kos/environ.sh ]; then
                source /opt/toolchains/dc/kos/environ.sh
              else
                echo "❌ environ.sh não encontrado!"
                find / -name "environ.sh" 2>/dev/null
                exit 1
              fi
              
              echo "KOS_BASE = $KOS_BASE"
              echo ""
              echo "Conteúdo do diretório:"
              ls -la
              echo ""
              echo "Conteúdo da pasta src/:"
              ls -la src/
              echo ""
              echo "Iniciando compilação..."
              
              make clean
              make -j$(nproc)
              
              EXIT_CODE=$?
              
              echo ""
              echo "Resultado:"
              if [ $EXIT_CODE -eq 0 ]; then
                echo "✅ Compilação bem sucedida!"
                ls -la *.elf 2>/dev/null || echo "⚠️ Nenhum .elf encontrado"
              else
                echo "❌ Compilação falhou! Código: $EXIT_CODE"
              fi
              
              exit $EXIT_CODE
            '

      - name: Verificar .elf gerado
        run: |
          echo "========================================="
          echo "Verificando arquivos gerados..."
          echo "========================================="
          ls -la *.elf 2>/dev/null || echo "❌ NENHUM .elf encontrado!"
          
          if [ ! -f *.elf ] 2>/dev/null; then
            echo "❌ ERRO: Nenhum .elf foi gerado!"
            exit 1
          fi
          echo "✅ .elf encontrado!"

      - name: Instalar mkdcdisk
        if: success()
        run: |
          echo "Instalando mkdcdisk..."
          sudo apt-get update
          sudo apt-get install -y git meson build-essential pkg-config libisofs-dev
          git clone https://gitlab.com/simulant/mkdcdisc
          cd mkdcdisc
          meson setup builddir
          meson compile -C builddir
          sudo cp builddir/mkdcdisc /usr/local/bin/mkdcdisk
          echo "✅ mkdcdisk instalado!"

      - name: Criar imagem CDI
        if: success()
        run: |
          echo "========================================="
          echo "Criando imagem CDI..."
          echo "========================================="
          
          ELF_FILE=$(ls *.elf 2>/dev/null | head -n 1)
          if [ -z "$ELF_FILE" ]; then
            echo "❌ ERRO: Nenhum arquivo .elf encontrado!"
            exit 1
          fi
          
          echo "📦 Usando: $ELF_FILE"
          mkdcdisk -e "$ELF_FILE" -o pong.cdi -n "PONG"
          
          if [ -f pong.cdi ]; then
            echo "✅ CDI criado com sucesso!"
            ls -la pong.cdi
          else
            echo "❌ Falha ao criar CDI"
            exit 1
          fi

      - name: Fazer upload do CDI
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pong-dreamcast
          path: pong.cdi
