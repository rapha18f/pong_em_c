name: Build Pong Dreamcast

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Baixar imagem oficial do KallistiOS
        run: |
          docker pull ghcr.io/kallistiosunchained/dc-toolchain:14.2-stable

      - name: Compilar Pong
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            ghcr.io/kallistiosunchained/dc-toolchain:14.2-stable \
            /bin/bash -c "
              source /opt/toolchains/dc/kos/environ.sh.master
              make
              ls -lh
            "

      - name: Verificar arquivo gerado
        run: |
          ls -lh
          test -f pong.elf

      - name: Publicar pong.elf
        uses: actions/upload-artifact@v4
        with:
          name: pong-elf
          path: pong.elf
