name: Build Pong Dreamcast

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Baixar toolchain
        run: docker pull ghcr.io/kallistiosunchained/dc-toolchain:14.2-stable

      - name: Compilar o jogo
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/kallistiosunchained/dc-toolchain:14.2-stable \
            /bin/bash -c '
              echo "========================================="
              echo "Procurando instalação do KOS..."
              echo "========================================="
              
              # Procura o environ.sh em vários locais possíveis
              find / -name "environ.sh" 2>/dev/null | grep -i kos
              
              echo ""
              echo "========================================="
              echo "Configurando ambiente KallistiOS..."
              echo "========================================="
              
              # Tenta diferentes caminhos para o environ.sh
              if [ -f /opt/kos/environ.sh ]; then
                source /opt/kos/environ.sh
              elif [ -f /opt/toolchains/dc/kos/environ.sh ]; then
                source /opt/toolchains/dc/kos/environ.sh
              elif [ -f /kos/environ.sh ]; then
                source /kos/environ.sh
              else
                echo "❌ environ.sh não encontrado!"
                echo "Procurando em toda parte..."
                find / -name "environ.sh" 2>/dev/null
                exit 1
              fi
              
              echo "KOS_BASE = $KOS_BASE"
              echo "PATH = $PATH"
              
              echo ""
              echo "========================================="
              echo "Verificando Makefile.rules..."
              echo "========================================="
              find $KOS_BASE -name "Makefile.rules" 2>/dev/null || echo "Makefile.rules não encontrado!"
              
              echo ""
              echo "========================================="
              echo "Compilando o jogo..."
              echo "========================================="
              make clean
              make -j$(nproc) 2>&1
              
              EXIT_CODE=$?
              
              echo ""
              echo "========================================="
              echo "Resultado da compilação:"
              echo "========================================="
              
              if [ $EXIT_CODE -eq 0 ]; then
                echo "✅ COMPILAÇÃO BEM SUCEDIDA!"
                ls -la *.elf 2>/dev/null || echo "⚠️ Nenhum .elf encontrado"
              else
                echo "❌ COMPILAÇÃO FALHOU! Código: $EXIT_CODE"
              fi
              
              exit $EXIT_CODE
            '

      - name: Instalar mkdcdisk
        if: success()
        run: |
          sudo apt-get update
          sudo apt-get install -y git meson build-essential pkg-config libisofs-dev
          git clone https://gitlab.com/simulant/mkdcdisc
          cd mkdcdisc
          meson setup builddir
          meson compile -C builddir
          sudo cp builddir/mkdcdisc /usr/local/bin/mkdcdisk

      - name: Criar imagem CDI
        if: success()
        run: |
          ELF_FILE=$(ls *.elf 2>/dev/null | head -n 1)
          if [ -z "$ELF_FILE" ]; then
            echo "❌ Arquivo .elf não encontrado!"
            exit 1
          fi
          echo "📦 Gerando CDI a partir de: $ELF_FILE"
          mkdcdisk -e "$ELF_FILE" -o pong.cdi -n "PONG"

      - name: Fazer upload do CDI
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pong-dreamcast
          path: pong.cdi
