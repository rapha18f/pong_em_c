name: Build Pong Dreamcast

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Baixar toolchain
        run: docker pull ghcr.io/kallistiosunchained/dc-toolchain:14.2-stable

      - name: Compilar o jogo (COM LOG DETALHADO)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/kallistiosunchained/dc-toolchain:14.2-stable \
            /bin/bash -c '
              echo "========================================="
              echo "Configurando ambiente KallistiOS..."
              echo "========================================="
              source /opt/toolchains/dc/kos/environ.sh
              
              echo "KOS_BASE = $KOS_BASE"
              echo "PATH = $PATH"
              
              echo ""
              echo "========================================="
              echo "Verificando arquivos do projeto..."
              echo "========================================="
              ls -la
              echo ""
              echo "Conteúdo da pasta src/:"
              ls -la src/ || echo "Pasta src/ não encontrada!"
              
              echo ""
              echo "========================================="
              echo "Compilando o jogo..."
              echo "========================================="
              
              # Tenta compilar e captura TODA a saída
              make clean
              make -j$(nproc) 2>&1
              
              # Salva o código de saída
              EXIT_CODE=$?
              
              echo ""
              echo "========================================="
              echo "Resultado da compilação:"
              echo "========================================="
              
              if [ $EXIT_CODE -eq 0 ]; then
                echo "✅ COMPILAÇÃO BEM SUCEDIDA!"
                ls -la *.elf || echo "⚠️ Nenhum .elf encontrado (estranho!)"
              else
                echo "❌ COMPILAÇÃO FALHOU! Código: $EXIT_CODE"
                echo ""
                echo "Possíveis causas:"
                echo "1. Erro de sintaxe no main.c"
                echo "2. Biblioteca do KOS não encontrada"
                echo "3. Caminho do KOS_BASE incorreto"
              fi
              
              exit $EXIT_CODE
            '

      - name: Instalar mkdcdisk (se a compilação deu certo)
        if: success()
        run: |
          sudo apt-get update
          sudo apt-get install -y git meson build-essential pkg-config libisofs-dev
          git clone https://gitlab.com/simulant/mkdcdisc
          cd mkdcdisc
          meson setup builddir
          meson compile -C builddir
          sudo cp builddir/mkdcdisc /usr/local/bin/mkdcdisk
          echo "✅ mkdcdisk instalado!"

      - name: Criar imagem CDI (se a compilação deu certo)
        if: success()
        run: |
          ELF_FILE=$(ls *.elf 2>/dev/null | head -n 1)
          if [ -z "$ELF_FILE" ]; then
            echo "❌ Arquivo .elf não encontrado!"
            exit 1
          fi
          echo "📦 Gerando CDI a partir de: $ELF_FILE"
          mkdcdisk -e "$ELF_FILE" -o pong.cdi -n "PONG"

      - name: Fazer upload do CDI (se criado)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pong-dreamcast
          path: pong.cdi
