on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gawk \
            patch \
            bzip2 \
            tar \
            make \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            gettext \
            wget \
            libelf-dev \
            texinfo \
            bison \
            flex \
            git \
            build-essential \
            diffutils \
            curl \
            libjpeg-dev \
            libpng-dev \
            python3 \
            pkg-config \
            cmake \
            libisofs-dev \
            meson \
            ninja-build

      - name: Clonar KallistiOS
        run: |
          sudo mkdir -p /opt/toolchains/dc
          sudo chown $USER:$USER /opt/toolchains/dc

          git clone https://github.com/KallistiOSUnchained/KallistiOS.git \
            /opt/toolchains/dc/kos

      - name: Verificar instalação
        run: |
          ls -la /opt/toolchains/dc
          ls -la /opt/toolchains/dc/kos
      - name: Preparar dc-chain
        run: |
          cd /opt/toolchains/dc/kos/utils/dc-chain
          cp Makefile.default.cfg Makefile.cfg

          # Compilar usando apenas um processo.
          sed -i 's/^makejobs=.*/makejobs=1/' Makefile.cfg || true

          echo "Conteúdo do Makefile.cfg:"
          cat Makefile.cfg

      - name: Compilar toolchain (SH4)
        run: |
          cd /opt/toolchains/dc/kos/utils/dc-chain
          make
