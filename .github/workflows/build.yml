#buid kos
name: Build Pong Dreamcast

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Baixar toolchain
        run: docker pull ghcr.io/kallistiosunchained/dc-toolchain:14.2-stable

      - name: Compilar o jogo
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/kallistiosunchained/dc-toolchain:14.2-stable \
            /bin/bash -c '
              # Configurar ambiente KallistiOS
              source /opt/toolchains/dc/kos/environ.sh
            
              # Compilar
              make clean
              make -j$(nproc)
              
              # Verificar se o .elf foi gerado
              ls -la *.elf || echo "Nenhum .elf encontrado!"
            '

      - name: Instalar mkdcdisk
        run: |
          sudo apt-get update
          sudo apt-get install -y git meson build-essential pkg-config libisofs-dev
          git clone https://gitlab.com/simulant/mkdcdisc
          cd mkdcdisc
          meson setup builddir
          meson compile -C builddir
          sudo cp builddir/mkdcdisk /usr/local/bin/

      - name: Criar imagem CDI
        run: |
          ELF_FILE=$(ls *.elf | head -n 1)
          if [ -z "$ELF_FILE" ]; then
            echo "❌ Arquivo .elf não encontrado!"
            exit 1
          fi
          echo "📦 Gerando CDI a partir de: $ELF_FILE"
          mkdcdisk -e "$ELF_FILE" -o pong.cdi -n "PONG"

      - name: Fazer upload do CDI
        uses: actions/upload-artifact@v4
        with:
          name: pong-dreamcast
          path: pong.cdi
